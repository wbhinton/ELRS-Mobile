name: Auto Translate

# Manually triggered only (Actions tab or `gh workflow run translate.yml`)
# to keep Gemini spend under control. Run it on `development`; it commits the
# new translations back to that branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Translate Script
        env:
          ARB_TRANSLATE_API_KEY: ${{ secrets.ARB_TRANSLATE_API_KEY }}
        run: ./scripts/translate.sh

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/l10n/
          git add lib/src/localization/
          git add scripts/arb_source_hashes.json
          git add assets/docs/
          git commit -m "chore(l10n): auto-generate translations via arb_translate" || echo "No changes to commit"
          git push
