name: Auto Translate

on:
  push:
    branches:
      - translations

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Patch arb_translate model mapping
        run: |
          sed -i "s/'\${model.key}-latest'/model.key/g" $HOME/.pub-cache/hosted/pub.dev/arb_translate-1.1.0/lib/src/translation_delegates/gemini_translation_delegate.dart

      - name: Run Translate Script
        env:
          ARB_TRANSLATE_API_KEY: ${{ secrets.ARB_TRANSLATE_API_KEY }}
        run: ./scripts/translate.sh

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/l10n/
          git add lib/src/localization/
          git add assets/docs/
          git commit -m "chore(l10n): auto-generate translations via arb_translate" || echo "No changes to commit"
          git push
