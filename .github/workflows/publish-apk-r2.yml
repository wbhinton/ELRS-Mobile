name: Publish APK to R2

# Mirrors a GitHub release's APK to the Cloudflare R2 bucket behind
# cdn.elrsmobile.com so users who can't reach Google Play or GitHub
# (e.g. behind the Great Firewall) can still download it directly.
#
# Objects written:
#   releases/<tag>/ELRS-Mobile-<tag>.apk   immutable, versioned copy
#   ELRS-Mobile-latest.apk                 stable link (overwritten each release)
#   latest.json                            version, version_code, sha256 and URLs
#
# Called by release.yml after a production release, and by
# build-direct-apk.yml for CDN-only builds (passing `artifact`). Can also
# be run manually to backfill or re-push an existing release.
#
# The stable link and latest.json only move forward: an APK with a lower
# versionCode than the one already published gets its versioned copy but
# leaves them alone, unless `allow_downgrade` is set to deliberately roll
# back a bad release.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.44)'
        required: true
        type: string
      artifact:
        description: 'Take ELRS-Mobile-<tag>.apk from this artifact of the calling run instead of the GitHub release'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.44)'
        required: true
        type: string
      allow_downgrade:
        description: 'Point latest.json and the stable link at this APK even if it is older than the one published'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  R2_BUCKET: elrs-mobile-releases
  CDN_BASE_URL: https://cdn.elrsmobile.com

jobs:
  publish:
    name: Upload APK to R2
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from build artifact
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}

      - name: Download APK from GitHub release
        if: inputs.artifact == ''
        run: |
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "ELRS-Mobile-${{ inputs.tag }}.apk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to R2
        run: |
          TAG="${{ inputs.tag }}"
          APK="ELRS-Mobile-$TAG.apk"
          VERSIONED_KEY="releases/$TAG/$APK"
          ENDPOINT="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"

          # Read the version from the APK itself: the app compares versionCode,
          # and a CDN-only build's tag isn't a plain version.
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          BADGING=$("$AAPT2" dump badging "$APK")
          VERSION_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$BADGING")
          VERSION=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")
          [[ -n "$VERSION_CODE" && -n "$VERSION" ]] || { echo "Could not read version from $APK"; exit 1; }

          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$APK")

          r2_put() {
            aws s3 cp "$1" "s3://$R2_BUCKET/$2" --endpoint-url "$ENDPOINT" --only-show-errors "${@:3}"
          }

          r2_put "$APK" "$VERSIONED_KEY" \
            --content-type application/vnd.android.package-archive \
            --content-disposition "attachment; filename=\"$APK\"" \
            --cache-control "public, max-age=31536000, immutable"

          # Read the published versionCode from R2 itself, not the cached CDN.
          if aws s3 cp "s3://$R2_BUCKET/latest.json" current-latest.json \
              --endpoint-url "$ENDPOINT" --only-show-errors 2> r2-error.txt; then
            CURRENT_CODE=$(jq -r '.version_code' current-latest.json)
          elif grep -q '404' r2-error.txt; then
            CURRENT_CODE=0
          else
            cat r2-error.txt
            exit 1
          fi

          if (( VERSION_CODE < CURRENT_CODE )) && [[ "$ALLOW_DOWNGRADE" != "true" ]]; then
            echo "::warning::$APK has versionCode $VERSION_CODE, older than the published $CURRENT_CODE. Uploaded $VERSIONED_KEY only; latest.json and ELRS-Mobile-latest.apk are unchanged."
            exit 0
          fi

          # Short cache so the edge picks up a new release within minutes.
          r2_put "$APK" "ELRS-Mobile-latest.apk" \
            --content-type application/vnd.android.package-archive \
            --content-disposition "attachment; filename=\"$APK\"" \
            --cache-control "public, max-age=300"

          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --argjson version_code "$VERSION_CODE" \
            --arg sha256 "$SHA256" \
            --argjson size "$SIZE" \
            --arg url "$CDN_BASE_URL/$VERSIONED_KEY" \
            --arg latest_url "$CDN_BASE_URL/ELRS-Mobile-latest.apk" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, version_code: $version_code, tag: $tag, sha256: $sha256, size: $size, url: $url, latest_url: $latest_url, published_at: $published_at}' \
            > latest.json
          cat latest.json

          r2_put latest.json "latest.json" \
            --content-type application/json \
            --cache-control "public, max-age=300"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Newer AWS CLI checksum defaults aren't fully supported by R2.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}

      - name: Verify CDN download
        run: |
          KEY="releases/${{ inputs.tag }}/ELRS-Mobile-${{ inputs.tag }}.apk"
          curl -sfSI "$CDN_BASE_URL/$KEY" | grep -iE '^(HTTP|content-type|content-length)'
