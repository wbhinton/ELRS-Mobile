name: Build and Release

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  translate:
    name: Translate App and Docs
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Patch arb_translate model mapping
        run: |
          cat << 'EOF' > patch.py
          import os
          path = os.path.expanduser('~/.pub-cache/hosted/pub.dev/arb_translate-1.1.0/lib/src/translation_delegates/gemini_translation_delegate.dart')
          if os.path.exists(path):
              content = open(path).read()
              old_str = "Model.gemini15Pro || Model.gemini15Flash => '${model.key}-latest'"
              new_str = "Model.gemini15Pro => 'gemini-2.5-pro', Model.gemini15Flash => 'gemini-2.5-flash'"
              content = content.replace(old_str, new_str)
              open(path, 'w').write(content)
              print("Patched arb_translate successfully.")
          else:
              print("Warning: path not found:", path)
          EOF
          python3 patch.py
          rm patch.py

      - name: Run Translate Script
        env:
          ARB_TRANSLATE_API_KEY: ${{ secrets.ARB_TRANSLATE_API_KEY }}
        run: ./scripts/translate.sh

      - name: Upload Translation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: translations-artifact
          path: |
            lib/l10n/
            lib/src/localization/
            assets/docs/
            website/src/i18n/
            website/src/content/docs/

      - name: Commit and Push Translations to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/l10n/
          git add lib/src/localization/
          git add assets/docs/
          git add website/src/i18n/
          git add website/src/content/docs/
          git commit -m "chore(l10n): auto-generate translations [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main

  build:
    name: Build APK and Release
    needs: translate
    if: always() && (needs.translate.result == 'success' || needs.translate.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Download Translations (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: translations-artifact

      - name: Rebuild Localization
        run: flutter gen-l10n

      - name: Build APK and App Bundle
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          else
            VERSION="0.0.0-ci-${{ github.run_number }}"
          fi
          BUILD_NUMBER=${{ github.run_number }}
          printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 -di > android/app/elrs-upload.jks
          flutter build apk --release \
            --build-name=$VERSION \
            --build-number=$BUILD_NUMBER \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          flutter build appbundle --release \
            --build-name=$VERSION \
            --build-number=$BUILD_NUMBER \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          
          mv build/app/outputs/flutter-apk/app-release.apk "ELRS-Mobile-${{ github.ref_name }}.apk"
          mv build/app/outputs/bundle/release/app-release.aab "ELRS-Mobile-${{ github.ref_name }}.aab"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Google Play
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/development'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: io.datarx.elrsmobile
          releaseFiles: ELRS-Mobile-${{ github.ref_name }}.aab
          track: internal
          status: completed
        env:
          NODE_OPTIONS: "--no-deprecation"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ELRS-Mobile-${{ github.ref_name }}.apk
            ELRS-Mobile-${{ github.ref_name }}.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Version Gist
        if: startsWith(github.ref, 'refs/tags/v') && success()
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          GIST_FILE="version.json"
          
          # Create JSON content
          JSON_CONTENT=$(cat <<EOF
          {
            "version": "$VERSION",
            "url": "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          }
          EOF
          )
          
          # Escaping for JSON string
          ESCAPED_CONTENT=$(echo "$JSON_CONTENT" | jq -aRs .)
 
          # Update Gist using GitHub API
          curl -sfSL \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GIST_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/gists/${{ secrets.GIST_ID }}" \
            -d "{\"files\":{\"$GIST_FILE\":{\"content\":$ESCAPED_CONTENT}}}"

  build-ios:
    name: Build & Distribute iOS
    needs: translate
    if: always() && (needs.translate.result == 'success' || needs.translate.result == 'skipped') && github.ref != 'refs/heads/development'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Download Translations (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: translations-artifact

      - name: Rebuild Localization
        run: flutter gen-l10n

      - name: Update CocoaPods Specs
        working-directory: ios
        run: pod repo update || true

      - name: Install Apple Certificate and Provisioning Profile
        run: |
          # 1. Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 2. Import certificate
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -k $KEYCHAIN_PATH -P "${{ secrets.P12_PASSWORD }}" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 3. Import provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/distribution.mobileprovision
          
          # Add keychain to search list (CRITICAL for codesign)
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed 's/\"//g')
          
          # Diagnostic: Check visibility
          echo "Installed Identities:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build IPA
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          else
            VERSION="0.0.0-ci-${{ github.run_number }}"
          fi
          BUILD_NUMBER=${{ github.run_number }}
          
          # Build IPA and export for App Store
          flutter build ipa --release \
            --build-name=$VERSION \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

          mv build/ios/ipa/*.ipa "ELRS-Mobile-${{ github.ref_name }}.ipa"

      - name: Upload to App Store Connect
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Create API key file for xcrun
          mkdir -p ~/.appstoreconnect/private_keys
          printf "%s" "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          
          xcrun altool --upload-app \
            --type ios \
            --file "ELRS-Mobile-${{ github.ref_name }}.ipa" \
            --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: Upload iOS IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ELRS-Mobile-${{ github.ref_name }}.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
