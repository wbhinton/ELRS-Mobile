name: Build & Release

on:
  push:
    tags:
      - 'v*' # Triggers on all version tags (v1.0.44, v1.0.44-rc1, v1.0.44-beta1, etc.)
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Custom Version (leave empty to read from tag or pubspec.yaml, e.g. 1.0.44-rc1)'
        required: false
        default: ''
      custom_build_number:
        description: 'Custom Build Number (leave empty to read from pubspec.yaml or run_number)'
        required: false
        default: ''
      play_store_track:
        description: 'Google Play Track'
        required: true
        type: choice
        options:
          - internal
          - beta
          - production
        default: internal

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      play_store_track: ${{ steps.metadata.outputs.play_store_track }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Version, Build Number, and Release Type
        id: metadata
        run: |
          # 1. Parse pubspec.yaml version and build number
          PUBSPEC_VERSION_FULL=$(grep '^version: ' pubspec.yaml | sed 's/version: //;s/"//g;s/'\''//g;s/ //g')
          PUBSPEC_NAME=$(echo "$PUBSPEC_VERSION_FULL" | cut -d'+' -f1)
          PUBSPEC_BUILD=$(echo "$PUBSPEC_VERSION_FULL" | cut -s -d'+' -f2)

          # 2. Determine Version
          if [[ -n "${{ inputs.custom_version }}" ]]; then
            VERSION="${{ inputs.custom_version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          else
            VERSION="$PUBSPEC_NAME"
          fi

          # 3. Determine Build Number (versionCode)
          if [[ -n "${{ inputs.custom_build_number }}" ]]; then
            BUILD_NUMBER="${{ inputs.custom_build_number }}"
          elif [[ -n "$PUBSPEC_BUILD" ]]; then
            BUILD_NUMBER="$PUBSPEC_BUILD"
          else
            BUILD_NUMBER="${{ github.run_number }}"
          fi

          TAG_NAME="v$VERSION"

          # 4. Check if Pre-Release / Release Candidate
          if [[ "$VERSION" =~ -(rc|beta|alpha|dev) ]] || [[ "$TAG_NAME" =~ -(rc|beta|alpha|dev) ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          # 5. Determine Google Play Track
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PLAY_TRACK="${{ inputs.play_store_track }}"
          else
            # For automatic tag triggers: internal track for RC/beta, internal for production (promote manually or configure)
            PLAY_TRACK="internal"
          fi

          echo "=========================================="
          echo "Resolved Version:      $VERSION"
          echo "Resolved Build Number: $BUILD_NUMBER"
          echo "Resolved Tag Name:     $TAG_NAME"
          echo "Is Pre-Release:        $IS_PRERELEASE"
          echo "Google Play Track:     $PLAY_TRACK"
          echo "=========================================="

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "play_store_track=$PLAY_TRACK" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android (APK & AAB) & Deploy Play Store
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Rebuild Localization
        run: flutter gen-l10n

      - name: Build APK and App Bundle
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"

          printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 -di > android/app/elrs-upload.jks

          echo "Building APK for version $VERSION ($BUILD_NUMBER)..."
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

          echo "Building AppBundle for version $VERSION ($BUILD_NUMBER)..."
          flutter build appbundle --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

          mv build/app/outputs/flutter-apk/app-release.apk "ELRS-Mobile-${{ needs.prepare.outputs.tag_name }}.apk"
          mv build/app/outputs/bundle/release/app-release.aab "ELRS-Mobile-${{ needs.prepare.outputs.tag_name }}.aab"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            ELRS-Mobile-${{ needs.prepare.outputs.tag_name }}.apk
            ELRS-Mobile-${{ needs.prepare.outputs.tag_name }}.aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: io.datarx.elrsmobile
          releaseFiles: "ELRS-Mobile-${{ needs.prepare.outputs.tag_name }}.aab"
          track: ${{ needs.prepare.outputs.play_store_track }}
          status: completed
        env:
          NODE_OPTIONS: "--no-deprecation"

  build-ios:
    name: Build iOS (IPA) & Deploy TestFlight
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Download iOS Platform SDK
        run: |
          xcrun simctl list > /dev/null
          xcodebuild -downloadPlatform iOS

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Rebuild Localization
        run: flutter gen-l10n

      - name: Update CocoaPods Specs
        working-directory: ios
        run: pod repo update || true

      - name: Install Apple Certificate and Provisioning Profile
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -k $KEYCHAIN_PATH -P "${{ secrets.P12_PASSWORD }}" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/distribution.mobileprovision
          
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed 's/\"//g')
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build IPA
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"

          echo "Building IPA for version $VERSION ($BUILD_NUMBER)..."
          flutter build ipa --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

          mv build/ios/ipa/*.ipa "ELRS-Mobile-${{ needs.prepare.outputs.tag_name }}.ipa"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: "ELRS-Mobile-${{ needs.prepare.outputs.tag_name }}.ipa"

      - name: Upload to App Store Connect (TestFlight)
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf "%s" "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          
          xcrun altool --upload-app \
            --type ios \
            --file "ELRS-Mobile-${{ needs.prepare.outputs.tag_name }}.ipa" \
            --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

  publish-release:
    name: Publish GitHub Release & Assets
    needs: [prepare, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-build

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.is_prerelease == 'true' && format('Release Candidate {0}', needs.prepare.outputs.tag_name) || format('Release {0}', needs.prepare.outputs.tag_name) }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            ELRS-Mobile-${{ needs.prepare.outputs.tag_name }}.apk
            ELRS-Mobile-${{ needs.prepare.outputs.tag_name }}.aab
            ELRS-Mobile-${{ needs.prepare.outputs.tag_name }}.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Version Gist (Production Only)
        if: ${{ needs.prepare.outputs.is_prerelease == 'false' && success() }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          GIST_FILE="version.json"
          
          JSON_CONTENT=$(cat <<EOF
          {
            "version": "$VERSION",
            "url": "https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag_name }}"
          }
          EOF
          )
          
          ESCAPED_CONTENT=$(echo "$JSON_CONTENT" | jq -aRs .)
          
          curl -sfSL \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GIST_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/gists/${{ secrets.GIST_ID }}" \
            -d "{\"files\":{\"$GIST_FILE\":{\"content\":$ESCAPED_CONTENT}}}"
