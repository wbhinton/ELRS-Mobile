name: CI

on:
  push:
    branches:
      - development
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned: 3.50 (Dart 3.14) pins test_api/matcher versions that conflict
          # with freezed 3.x + riverpod_generator 4.x. Bump together with those.
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated localisation code is committed; fail if it no longer
      # matches the ARB files (someone forgot to run `flutter gen-l10n`).
      - name: Check generated localizations are current
        run: |
          flutter gen-l10n
          git diff --exit-code lib/src/localization/

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
